
name: AM Pro APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'AMProAndroid_CloudBuild.zip'
      - '.github/workflows/build-ampro.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o AMProAndroid_CloudBuild.zip -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-PRO-APK
          path: project/**/build/outputs/apk/debug/*.apk
          retention-days: 7
